name: Bug report
description: Something in DuoKit behaves wrong
labels: [bug]
body:
  - type: dropdown
    id: port
    attributes:
      label: Which port?
      options: [SwiftUI, Web (JS / CSS), React, Demo site, Agent skill]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show it. For posture bugs, the `classify()` input is ideal.
      render: text
  - type: input
    id: device
    attributes:
      label: Device, posture and OS / browser
      placeholder: iPhone Duo, book, iOS 27.1 · or Safari 27.1 with Viewport Segments on
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DuoKit version or commit
